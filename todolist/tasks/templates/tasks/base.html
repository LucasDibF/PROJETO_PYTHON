{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do List{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'task_list' %}">📝 To-Do List</a>
    <div class="d-flex align-items-center text-white">
      {% if user.is_authenticated %}
        <span class="me-3">Olá, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light">Sair</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-light me-2" href="{% url 'login' %}">Entrar</a>
        <a class="btn btn-sm btn-light" href="{% url 'register' %}">Cadastrar</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

</body>
</html>
